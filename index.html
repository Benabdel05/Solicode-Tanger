<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot SOLICODE Tanger</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --bg: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --bot-bg: #e2e8f0;
      --shadow: 0 10px 40px rgba(0,0,0,0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Syne', 'IBM Plex Sans Arabic', Arial, sans-serif;
    }

    .chat-container {
      width: 100%;
      max-width: 870px;
      height: 90vh;
      background: var(--white);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    /* ── HEADER ── */
    .chat-header {
      background: var(--primary);
      color: white;
      padding: 16px 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .chat-header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .chat-header p {
      font-size: 13px;
      opacity: 0.85;
    }

    /* ── LANGUAGE SWITCHER ── */
    .lang-switcher {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .lang-btn {
      padding: 5px 11px;
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      background: transparent;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .lang-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .lang-btn.active {
      background: white;
      color: var(--primary);
      border-color: white;
    }

    /* Tifinagh script toggle inside Tamazight */
    .script-toggle {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      font-size: 11px;
      color: white;
    }

    .script-toggle button {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 5px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .script-toggle button.active {
      background: white;
      color: var(--primary);
    }

    /* ── CHAT BOX ── */
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    .message {
      margin-bottom: 14px;
      padding: 13px 16px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.65;
      font-size: 14.5px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bot {
      background: var(--bot-bg);
      color: var(--text);
    }

    .user {
      background: var(--primary);
      color: white;
      margin-left: auto;
    }

    .message ul {
      margin-left: 20px;
      margin-top: 8px;
    }

    .message li {
      margin-bottom: 4px;
    }

    /* RTL support for Tifinagh — no RTL needed (Tifinagh is LTR) */
    .rtl-text {
      direction: rtl;
      text-align: right;
    }

    /* ── QUICK BUTTONS ── */
    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      background: #f1f5f9;
      border-top: 1px solid var(--border);
    }

    .quick-buttons button {
      padding: 9px 13px;
      border: none;
      background: var(--bot-bg);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      transition: background 0.2s;
    }

    .quick-buttons button:hover {
      background: #cbd5e1;
    }

    /* ── INPUT AREA ── */
    .input-area {
      display: flex;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: white;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 13px 16px;
      border: 1.5px solid #ccc;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: var(--primary);
    }

    .input-area button {
      padding: 13px 20px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-family: inherit;
      font-weight: 600;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-area button:hover {
      background: var(--primary-dark);
    }

    /* Tifinagh font support */
    @font-face {
      font-family: 'TifinaghFallback';
      src: local('Noto Sans Tifinagh'), local('Code2000');
    }

    .tifinagh {
      font-family: 'Noto Sans Tifinagh', 'TifinaghFallback', serif;
      font-size: 1.05em;
    }

    @media (max-width: 768px) {
      .chat-container { height: 95vh; }
      .lang-btn { font-size: 11px; padding: 4px 9px; }
    }
  </style>
</head>

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let currentLang = "fr";
let currentScript = "tifinagh"; // tifinagh | latin

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function getLang() {
  if (currentLang === "tz" && currentScript === "latin") {
    // Merge base tz with latin overrides
    return Object.assign({}, T.tz, T.tz.latin);
  }
  return T[currentLang];
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".lang-btn").forEach(b => {
    if (b.textContent.includes(langLabel(lang))) b.classList.add("active");
  });
  // Show/hide script toggle
  document.getElementById("scriptToggle").style.display = lang === "tz" ? "flex" : "none";
  applyUI();
  showWelcome();
}

function langLabel(lang) {
  return { fr:"Français", en:"English", es:"Español", da:"Darija", tz:"ⴰⵎⴰⵣⵉⵖ" }[lang];
}

function setScript(script) {
  currentScript = script;
  document.getElementById("btnTifinagh").classList.toggle("active", script === "tifinagh");
  document.getElementById("btnLatin").classList.toggle("active", script === "latin");
  applyUI();
  showWelcome();
}

function applyUI() {
  const L = getLang();
  // Subtitle
  document.getElementById("headerSubtitle").innerHTML = L.subtitle;
  // Input placeholder & button
  const input = document.getElementById("userInput");
  input.placeholder = L.placeholder;
  document.getElementById("sendBtn").textContent = L.send;
  // RTL
  const rtl = !!L.rtl;
  document.documentElement.dir = rtl ? "rtl" : "ltr";
  input.style.textAlign = rtl ? "right" : "left";
  // Quick buttons
  const qb = document.getElementById("quickButtons");
  qb.innerHTML = "";
  L.buttons.forEach(label => {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.onclick = () => quickQuestion(label);
    qb.appendChild(btn);
  });
  // Tifinagh font class on chatbox
  document.getElementById("chatBox").className =
    (currentLang === "tz" && currentScript === "tifinagh") ? "chat-box tifinagh" : "chat-box";
}

function showWelcome() {
  const L = getLang();
  const chatBox = document.getElementById("chatBox");
  chatBox.innerHTML = "";
  addMessage(L.welcome, "bot");
}

// ═══════════════════════════════════════════════
//  CHAT LOGIC
// ═══════════════════════════════════════════════
const chatBox = document.getElementById("chatBox");

function addMessage(text, sender) {
  const msg = document.createElement("div");
  msg.classList.add("message", sender);
  if (getLang().rtl && sender === "bot") msg.classList.add("rtl-text");
  msg.innerHTML = text;
  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function quickQuestion(question) {
  document.getElementById("userInput").value = question;
  sendMessage();
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (text === "") return;
  addMessage(text, "user");

  const L = getLang();
  const msg = text.toLowerCase();
  let response = "";

  // Match keywords
  const kw = T[currentLang].keywords || (currentLang === "tz" ? T.tz.keywords : {});
  let matched = false;

  for (const [key, words] of Object.entries(kw)) {
    if (words.some(w => msg.includes(w.toLowerCase()))) {
      response = L.responses[key];
      matched = true;
      break;
    }
  }

  if (!matched) response = L.unknown;

  setTimeout(() => addMessage(response, "bot"), 500);
  input.value = "";
}

// Enter key
document.getElementById("userInput").addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
applyUI();
showWelcome();

</script>
